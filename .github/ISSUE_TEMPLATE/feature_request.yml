name: 功能建议 / Feature request
description: 提出新功能或改进建议
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题或使用场景
      description: 这个功能能解决什么痛点或满足什么需求
      placeholder: 例如：希望能支持双面打印 / 希望能一次扫描多页……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你期望的功能
      description: 描述一下你希望它怎么工作
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 相关截图、参考的 App 或其他说明
